[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/manage.py" = ["E402"]  # Standalone CLI resolves sibling modules first.
"tests/*.py" = ["E402"]  # Tests exercise standalone container modules.
