name: Validate

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install development tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Lint and security checks
        run: |
          .venv/bin/ruff check container scripts tests
          .venv/bin/ruff format --check container scripts tests
          .venv/bin/bandit -r container scripts -ll
          python3 scripts/publication.py check
          python3 scripts/publication.py history
          sh -n docker-entrypoint.sh
          docker compose --env-file .env.example --profile deployment --profile legacy --profile admin config --quiet
      - name: Scan full history for secrets
        run: >-
          docker run --rm --network none --read-only -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --log-opts=--all --redact=100 --no-banner
      - name: Build application
        run: docker build --pull -t mkbackup-sftp-test:local .
      - name: Unit tests
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=256m \
            --entrypoint python3 -v "$PWD:/workspace:ro" -w /workspace \
            mkbackup-sftp-test:local -m unittest discover -s tests -p 'test_*.py' -v
      - name: Docker and HAProxy integration tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 tests/integration.py
