# Intentionally plaintext for RouterOS 6. Never expose archive storage here.
listen=YES
listen_ipv6=NO
listen_port=2121
background=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
download_enable=NO
dirlist_enable=NO
chroot_local_user=YES
allow_writeable_chroot=NO
local_umask=077
file_open_mode=0600
userlist_enable=YES
userlist_deny=NO
userlist_file=/run/mkbackup/ftp-users
pam_service_name=mkbackup-ftp
check_shell=NO
secure_chroot_dir=/run/vsftpd/empty
ssl_enable=NO
pasv_enable=YES
port_enable=NO
pasv_address=@PUBLIC_ADDRESS@
pasv_min_port=@PASSIVE_MIN@
pasv_max_port=@PASSIVE_MAX@
pasv_promiscuous=NO
max_clients=20
max_per_ip=4
max_login_fails=3
delay_failed_login=2
idle_session_timeout=60
data_connection_timeout=120
accept_timeout=30
connect_timeout=30
delete_failed_uploads=NO
chmod_enable=NO
ls_recurse_enable=NO
cmds_allowed=ABOR,CDUP,CWD,EPSV,FEAT,NOOP,OPTS,PASS,PASV,PWD,QUIT,SIZE,STOR,STRU,SYST,TYPE,USER
syslog_enable=YES
xferlog_enable=YES
xferlog_std_format=NO
log_ftp_protocol=NO
seccomp_sandbox=YES
